<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITIDA Official Freelancer ID | Mohamed Abdelkader</title>
  <meta name="description" content="Official Freelancer ID issued by ITIDA & Freelancer.eg for Mohamed Abdelkader Abdelmonem. ID: 4004360199. Valid 2026–2027." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --gold: #c9a84c;
      --text: #e8e6e0;
      --muted: #6b6a72;
      --accent: #3ecf8e;
    }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 60vw;
      height: 40vh;
      background: radial-gradient(ellipse, rgba(62,207,142,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: relative; z-index: 1;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .back {
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); transition: color 0.2s;
    }
    .back:hover { color: var(--gold); }
    .header-info { text-align: right; }
    .header-issuer {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    }
    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1rem; font-weight: 400; color: var(--text);
    }
    .actions {
      position: relative; z-index: 1;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .meta-pill {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em;
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .meta-pill.highlight {
      background: rgba(62,207,142,0.1);
      border-color: rgba(62,207,142,0.25);
      color: var(--accent);
    }
    .dl-btn {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      background: var(--gold); color: #0a0a0f;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
      padding: 6px 14px; border-radius: 6px;
      transition: opacity 0.2s, transform 0.2s;
    }
    .dl-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .viewer { flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; }
    .pdf-container {
      flex: 1; width: 100%;
      min-height: calc(100vh - 160px);
      background: #05050a;
      display: flex; align-items: center; justify-content: center;
    }
    /* Freelancer ID is portrait — give it a centered, contained view */
    .pdf-container iframe {
      width: 100%; height: 100%;
      min-height: calc(100vh - 160px);
      border: none; display: block;
    }
    .pdf-fallback {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4rem 2rem; text-align: center; gap: 1rem;
    }
    .pdf-fallback p { color: var(--muted); font-size: 0.9rem; }
    .pdf-fallback a { color: var(--gold); text-decoration: none; font-family: 'DM Mono', monospace; font-size: 0.8rem; }
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem; letter-spacing: 0.08em; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;
    }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      .header-info { display: none; }
      .actions { padding: 0.75rem 1.25rem; }
      footer { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <a class="back" href="./">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    All Certificates
  </a>
  <div class="header-info">
    <p class="header-issuer">ITIDA · Freelancer.eg</p>
    <p class="header-title">Official Freelancer ID</p>
  </div>
</header>

<div class="actions">
  <span class="meta-pill">ID: 4004360199</span>
  <span class="meta-pill">Issued: 25 Feb 2026</span>
  <span class="meta-pill">Expires: 24 Feb 2027</span>
  <span class="meta-pill highlight">Active & Valid</span>
  <a class="dl-btn" href="./itida-freelancer-id.pdf" download="Mohamed_Abdelkader_ITIDA_Freelancer_ID.pdf">
    <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 2V9M7 9L4 6M7 9L10 6M2 11H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Download PDF
  </a>
</div>

<div class="viewer">
  <div class="pdf-container" id="pdfContainer">
    <iframe
      id="pdfFrame"
      src="./itida-freelancer-id.pdf#view=FitH&toolbar=1"
      title="ITIDA Official Freelancer ID — Mohamed Abdelkader"
      allowfullscreen
    ></iframe>
  </div>
  <div class="pdf-fallback" id="pdfFallback">
    <p>Your browser couldn't display the PDF inline.</p>
    <a href="./itida-freelancer-id.pdf" target="_blank">Open PDF in new tab ↗</a>
  </div>
</div>

<footer>
  <span>Mohamed Abdelkader · <a href="https://muhammadabdelkader.github.io/Certificates/">Certificates</a></span>
  <span><a href="https://muhammadabdelkader.github.io/My-Portfolio/" target="_blank">Portfolio</a> · <a href="https://muhammadabdelkader.github.io/CV/" target="_blank">CV</a></span>
</footer>

<script>
  const frame = document.getElementById('pdfFrame');
  const container = document.getElementById('pdfContainer');
  const fallback = document.getElementById('pdfFallback');
  frame.addEventListener('error', () => { container.style.display = 'none'; fallback.style.display = 'flex'; });
  setTimeout(() => {
    try {
      if (frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.innerHTML === '') {
        container.style.display = 'none'; fallback.style.display = 'flex';
      }
    } catch(e) {}
  }, 3000);
</script>

</body>
</html>
